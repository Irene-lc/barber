spring.application.name=barber
# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/barber
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false


# SEGURIDAD
#Par�metros de seguridad
security.jwt.token.secret-key=${BARBER_SECRET_KEY}
#Tiempo de expiracion del JWT en minutos
security.jwt.token.expire-length=480

#Parametros de conexion al Sistema 1
sistema1.url-base=http://172.16.75.31:8080
sistema1.connect-timeout=1000
sistema1.read-timeout=2000

# Parametros de conexion a Stereum Pay
stereum.url-base=https://api.stereum.tech
stereum.api-key=${STEREUM_API_KEY}
stereum.api-secret=${STEREUM_SECRET_KEY}
stereum.connect-timeout=10000
stereum.read-timeout=40000


#cuantos miguels activos listos para trabajar
async.core-pool-size=5
#hasta cuantos hilos puedo clonar
async.max-pool-size=10
#la cantidad de tareas que puedo encolar
async.queue-capacity=20

#Exception
spring.mvc.problem-details.enabled=true


mail.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=false
mail.smtp.starttls.enable=true
mail.smtp.protocol=smtp
mail.smtp.username=${MAIL_SMTP_USERNAME}
mail.smtp.password=${MAIL_SMTP_PASSWORD}
mail.smtp.from-mail=${MAIL_SMTP_USERNAME}
mail.smtp.mail-noreply=noreply@gmail.com


####################################
# Cambiar el tipo de almacenamiento de memoria a base de datos
spring.quartz.job-store-type=jdbc
# Configuración de inicialización del esquema de Quartz
spring.quartz.jdbc.initialize-schema=never
# Comportamiento general del Scheduler
spring.quartz.wait-for-job-completion-on-shutdown=true
spring.quartz.overwrite-existing-jobs=true
# Configuración para entornos en Clúster (Alta disponibilidad)
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
# Configuración del pool de hilos
spring.quartz.properties.org.quartz.threadPool.threadCount=20
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate


# O exponer solo algunos específicos si quieres ser selectivo
management.endpoints.web.exposure.include=health,info,metrics
# Muestra siempre los detalles de todos los componentes de salud
management.endpoint.health.show-details=always
# Muestra también los componentes individuales de forma detallada
management.endpoint.health.show-components=always
# Activar la recopilación de datos de Java y del OS
management.info.java.enabled=true
management.info.os.enabled=true
# Crear tus propios datos personalizados bajo el prefijo 'info'
info.app.name=Klipp
info.app.description=Gestiona tus clientes y citas.
info.app.version=1.0.0
info.environment=Desarrollo

#Cache
spring.cache.type=caffeine
#listas de cache
spring.cache.cache-names=usuario,sucursal,empresa
#Configuracion de la cache
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=5000,expireAfterWrite=10m,recordStats